plugins {
    id 'com.android.application'
}

apply plugin: "AndResGuard"

android {
    compileSdkVersion rootProject.ext.android.compileSdkVersion
    buildToolsVersion rootProject.ext.android.buildToolsVersion
    namespace = "com.yiman.ad.adbid"
    defaultConfig {
        applicationId "com.yd.saas.hm.sdk.demo"
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode 20100013
        versionName "2.1.0.13"
    }
    signingConfigs {
        debug {
            storeFile file("./test.jks") // 密钥库文件路径
            storePassword "123456" // 密钥库密码
            keyAlias "key0" // 密钥别名
            keyPassword "123456" // 密钥密码
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // 是否混淆
            minifyEnabled true
            // 混淆配置文件的位置
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            // 混淆配置文件的位置
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

andResGuard {
    def mapping = file("resource_mapping.txt")
    mappingFile = mapping.exists() ? mapping : null
    use7zip = true
    useSign = true
    keepRoot = false
    mergeDuplicatedRes = true
    whiteList = [
            // Manifest 引用的资源
            "R.mipmap.ic_launcher",
            "R.mipmap.ic_launcher_round",
            "R.string.app_name",
            "R.xml.data_extraction_rules",
            "R.xml.backup_rules",
            "R.xml.network_security_config",
            "R.style.Theme_AdBid",
            // ConstraintLayout 约束 ID
            "R.id.constraint*",
            // 字体资源
            "R.font.*",
            // 常见 SDK 资源
            "R.raw.*",
    ]
    compressFilePattern = [
            "*.png",
            "*.jpg",
            "*.jpeg",
            "*.gif",
            "*.webp",
    ]
    sevenzip {
        artifact = "io.github.leon406:SevenZip:1.2.23"
    }
}

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("resguard") && !task.name.toLowerCase().contains("release")
    }.configureEach {
        enabled = false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    //demo依赖库
    implementation(libs.androidx.core)
    api(libs.androidx.appcompat)
    implementation(libs.glide)
    implementation(libs.androidx.recyclerview)
    implementation(libs.androidx.constraintlayout)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation(libs.play.services.ads.identifier)
    implementation(libs.play.services.location)
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'

    //*********************广告adx接入*******************************************

    //领摩ADX
    implementation(files("libs/adbid_sdk_2.1.0.23_0903_1658.aar"))

    //微信小程序,各平台都建议接入，有利于提高收益，需提供wxId
    implementation("com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.8.0")

    // 如果初始化手动传入oaid则无需引用,未手动传入oaid则必须要引用，否则无法请求广告
    implementation("com.huawei.hms:ads-identifier:3.4.62.300")
    implementation("com.hihonor.mcs:ads-identifier:1.0.2.301")

}


